<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flappy Bird — AutoBot</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;background:linear-gradient(#87CEEB,#bfe9ff);display:flex;align-items:center;justify-content:center}
    .wrap{width:min(700px,96vw);max-width:700px;background:rgba(255,255,255,0.06);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,0.12);backdrop-filter: blur(4px)}
    canvas{display:block;width:100%;height:auto;background:linear-gradient(#8dd3ff,#bfe9ff);border-radius:8px}
    .hud{display:flex;justify-content:space-between;align-items:center;color:#032; font-weight:600;margin-top:8px}
    button{padding:8px 12px;border-radius:8px;border:0;background:#032;color:#fff;cursor:pointer}
    .muted{opacity:0.7;font-weight:500}
    .small{font-size:0.9rem}
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game"></canvas>
    <div class="hud small">
      <div>
        <span id="score">Poäng: 0</span>
        <span class="muted"> — Högsta: <span id="best">0</span></span>
      </div>
      <div>
        <button id="restart">Starta / Starta om</button>
      </div>
    </div>
    <div class="hud small" style="margin-top:6px">
      <div class="muted">AutoBot aktiv — spelar perfekt själv</div>
    </div>
  </div>

  <script>
  const CONFIG = {
    gravity: 0.6,
    flapImpulse: -9.5,
    pipeGap: 140,
    pipeDistance: 230,
    pipeWidth: 60,
    pipeSpeed: 2.6,
    birdRadius: 14,
    spawnOffset: 60
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const styleW = Math.min(700, Math.max(320, document.querySelector('.wrap').clientWidth - 24));
    canvas.style.width = styleW + 'px';
    canvas.width = Math.floor(styleW * ratio);
    canvas.height = Math.floor(styleW * 0.65 * ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let bird, pipes, frame, score, best, running;
  function reset(){
    bird = { x: canvas.width/4/(window.devicePixelRatio||1), y: (canvas.height/2)/(window.devicePixelRatio||1), vy:0 };
    pipes = [];
    frame = 0;
    score = 0;
    running = true;
    document.getElementById('score').textContent = 'Poäng: 0';
    best = Math.max(best || 0, Number(localStorage.getItem('flappy_best') || 0));
    document.getElementById('best').textContent = best;
  }

  function spawnPipe(){
    const H = canvas.height/(window.devicePixelRatio||1);
    const topY = CONFIG.spawnOffset + Math.random() * (H - CONFIG.spawnOffset*2 - CONFIG.pipeGap);
    pipes.push({ x: canvas.width/(window.devicePixelRatio||1) + 40, top: topY, bottom: topY + CONFIG.pipeGap, scored:false });
  }

  function circleRectCollide(cx, cy, r, rx, ry, rw, rh){
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return (dx*dx + dy*dy) <= r*r;
  }

  function autoControl(){
    if(pipes.length === 0) return;
    const next = pipes.find(p=>p.x + CONFIG.pipeWidth > bird.x - 10);
    if(!next) return;
    const targetY = (next.top + next.bottom)/2;
    const diff = bird.y - targetY;
    if(diff > 10 && bird.vy > 0){
      bird.vy = CONFIG.flapImpulse;
    }
  }

  function update(){
    if(!running) return;
    const H = canvas.height/(window.devicePixelRatio||1);
    frame++;
    bird.vy += CONFIG.gravity;
    bird.y += bird.vy;
    if(frame % Math.floor(CONFIG.pipeDistance / CONFIG.pipeSpeed) === 0){ spawnPipe(); }
    autoControl();

    for(let i=pipes.length-1;i>=0;i--){
      const p = pipes[i];
      p.x -= CONFIG.pipeSpeed;
      if(!p.scored && (p.x + CONFIG.pipeWidth/2) < bird.x){
        p.scored = true; score++;
        document.getElementById('score').textContent = 'Poäng: '+score;
        if(score > best){ best = score; localStorage.setItem('flappy_best', best); document.getElementById('best').textContent = best; }
      }
      if(p.x + CONFIG.pipeWidth < -50) pipes.splice(i,1);
    }
    if(bird.y + CONFIG.birdRadius > H) bird.y = H - CONFIG.birdRadius;
  }

  function draw(){
    const W = canvas.width/(window.devicePixelRatio||1);
    const H = canvas.height/(window.devicePixelRatio||1);
    ctx.clearRect(0,0,W,H);
    const groundH = Math.min(80, H*0.13);
    ctx.fillStyle = '#6bb24a';
    ctx.fillRect(0, H - groundH, W, groundH);

    ctx.fillStyle = '#2b8b3b';
    pipes.forEach(p=>{
      ctx.fillRect(p.x,0,CONFIG.pipeWidth,p.top);
      ctx.fillRect(p.x,p.bottom,CONFIG.pipeWidth,H - p.bottom - groundH);
    });

    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.beginPath(); ctx.fillStyle='#ffdd57'; ctx.arc(0,0,CONFIG.birdRadius,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle='#000'; ctx.arc(6,-4,3,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.font='600 26px Inter, system-ui';
    ctx.fillStyle='#032'; ctx.textAlign='center';
    ctx.fillText(score,W/2,36);
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  document.getElementById('restart').addEventListener('click',()=>reset());

  reset();
  loop();
  </script>
</body>
</html>
